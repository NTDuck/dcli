[workspace]
members = [
    "dcli/*/*",
    "libs/*",
    "libs/modules",
]
resolver = "2"

[workspace.package]
edition = "2024"

# Lines prefixed with '#' use default configuration
# Lines prefixed with '##' are renamed/deprecated
# See: https://doc.rust-lang.org/rustc/lints/listing/index.html
[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "deny"
ambiguous_negative_literals = "forbid"
## async-idents = "allow"
# closure_returning_async_block = "allow"
deprecated_safe_2024 = "warn"
## disjoint-capture-migration = "allow"
# edition_2024_expr_fragment_specifier = "allow"
## elided-lifetime-in-path = "allow"
elided_lifetimes_in_paths = "forbid"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
fuzzy_provenance_casts = "forbid"
if_let_rescope = "warn"
impl_trait_overcaptures = "warn"
## keyword-idents = "allow"
keyword_idents_2018 = "forbid"
keyword_idents_2024 = "forbid"
let_underscore_drop = "forbid"
lossy_provenance_casts = "forbid"
macro_use_extern_crate = "forbid"
meta_variable_misuse = "warn"
missing_abi = "forbid"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
# missing_docs = "allow"
missing_unsafe_on_extern = "forbid"
# multiple_supertrait_upcastable = "allow"
must_not_suspend = "warn"
non_ascii_idents = "forbid"
non_exhaustive_omitted_patterns = "warn"
## or-patterns-back-compat = "allow"
redundant_imports = "forbid"
redundant_lifetimes = "forbid"
rust_2021_incompatible_closure_captures = "warn"
rust_2021_incompatible_or_patterns = "warn"
rust_2021_prefixes_incompatible_syntax = "warn"
rust_2021_prelude_collisions = "forbid"
rust_2024_guarded_string_incompatible_syntax = "forbid"
rust_2024_incompatible_pat = "warn"
rust_2024_prelude_collisions = "forbid"
## single-use-lifetime = "allow"
single_use_lifetimes = "forbid"
tail_expr_drop_order = "forbid"
# trivial_casts = "allow"
trivial_numeric_casts = "forbid"
unit_bindings = "forbid"
unnameable_types = "forbid"
unqualified_local_imports = "forbid"
unreachable_pub = "warn"
unsafe_attr_outside_unsafe = "forbid"
# unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "warn"
# unstable_features = "allow"
unused_crate_dependencies = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "forbid"
unused_macro_rules = "forbid"
# unused_qualifications = "allow"
unused_results = "warn"
variant_size_differences = "warn"

# abi_unsupported_vector_types = "warn"
# ambiguous_glob_imports = "warn"
# ambiguous_glob_reexports = "warn"
ambiguous_wide_pointer_comparisons = "forbid"
anonymous_parameters = "forbid"
array_into_iter = "forbid"
