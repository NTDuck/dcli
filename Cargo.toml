[workspace]
members = [
    "dcli/core/domain",
    "dcli/core/use-cases/boundaries",
    "dcli/core/use-cases/gateways",
    "dcli/core/use-cases/interactors",
    "dcli/core/use-cases/models",
    "dcli/infrastructures/adapters",
    "dcli/infrastructures/services",
    "dcli/configurations/*",
    "libs/*",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Cross-cutting concerns, centralized
axiom = { path = "libs/axiom" }

# Crates that we choose to marry
# See: https://blessed.rs/crates
serde = { version = "1.0", features = ["derive"] }

[workspace.lints.rust]
# See: https://doc.rust-lang.org/rustc/lints/listing/index.html

[workspace.lints.clippy]
# See: https://rust-lang.github.io/rust-clippy/master/index.html
derived_hash_with_manual_eq = "allow"
new_without_default = "allow"
missing_safety_doc = "allow"
useless_conversion = "allow"

[workspace.metadata.rust-analyzer]
# See: https://rust-analyzer.github.io/book/diagnostics.html
