[workspace]
members = [
    "dcli/*/*",
    "libs/*",
    "libs/modules",
]
resolver = "2"

# https://doc.rust-lang.org/rustc/lints/listing/index.html
[workspace.lints.rust]
non_snake_case = { level = "allow" }
non_upper_case_globals = { level = "allow" }

# https://rust-lang.github.io/rust-clippy/stable/index.html
[workspace.lints.clippy]
needless_return = "allow"

[workspace.metadata.rust-analyzer]
diagnostics.disabled = ["unconventional_variable_names"]
