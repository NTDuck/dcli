[package]
name = "rest-api-adapters"
version = "0.1.0"
edition.workspace = true

[dependencies]
axiom = { workspace = true }
serde = { workspace = true }

use-cases = { path = "../../../core/use-cases", features = ["boundaries"] }

axum = { version = "0.8", optional = true }
serde_qs = { version = "0.14", optional = true }
ureq = { version = "3.0", features = ["json"], optional = true }

[lints]
workspace = true

[features]
client = ["dep:serde_qs", "dep:ureq"]
server = ["dep:axum"]
