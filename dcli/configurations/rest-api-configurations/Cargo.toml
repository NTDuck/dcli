[package]
name = "rest-api-configurations"
version = "0.1.0"
edition.workspace = true

[dependencies]
use-cases = { path = "../../core/use-cases" }
rest-api-adapters = { path = "../../infrastructures/adapters/rest-api-adapters", features = ["server"] }
gateways-impl = { path = "../../infrastructures/gateways-impl" }

axum = "0.8"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

[lints]
workspace = true
